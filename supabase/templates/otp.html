<!doctype html>
<html lang="nb">
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1b1b1f; max-width: 480px; margin: 0 auto; padding: 24px">
    <h2 style="margin: 0 0 16px">Din innloggingskode til Heima</h2>
    <p>Skriv inn denne koden i appen:</p>
    <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0">{{ .Token }}</p>
    <p>Koden er gyldig i 15 minutter og kan bare brukes én gang.</p>
    <p style="color: #5f6168; font-size: 13px">
      Ba du ikke om denne koden? Da kan du se bort fra e-posten. Heima ber deg aldri oppgi koden
      til andre, og vi sender aldri lenker for innlogging.
    </p>
  </body>
</html>
