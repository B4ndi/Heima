version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom', 'jest-expo', 'eslint-config-expo']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
